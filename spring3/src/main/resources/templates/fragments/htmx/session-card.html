<div th:fragment="chunk(sseSubscriptions)" class="flex flex-col gap-3 w-full">
    <div th:if="${#lists.isEmpty(sseSubscriptions)}" class="text-center py-6 px-4 rounded-xl border border-dashed border-base-300 bg-base-200/50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto text-base-content/40 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <p class="text-sm font-medium text-base-content/60">No active subscriptions</p>
    </div>

    <div th:each="sseSubscription : ${sseSubscriptions}"
         class="group relative overflow-hidden rounded-xl bg-base-100 p-4 shadow-sm border border-base-200 hover:border-primary/40 hover:shadow-md transition-all duration-200">
        <div class="flex items-start justify-between gap-3 mb-2">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-success"></span>
                </span>
                <span class="text-xs font-semibold uppercase tracking-wider text-success">Active</span>
            </div>
        </div>

        <div class="space-y-2">
            <div>
                <label class="text-[11px] font-medium text-base-content/50 uppercase tracking-wider block">Session ID</label>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <code class="font-mono text-xs font-medium text-primary bg-primary/10 px-2 py-0.5 rounded select-all break-all"
                          th:text="${sseSubscription.sessionId()}">SessionId</code>
                </div>
            </div>

            <div>
                <label class="text-[11px] font-medium text-base-content/50 uppercase tracking-wider block">User Agent</label>
                <p class="text-xs text-base-content/70 font-mono bg-base-200/60 rounded px-2 py-1 truncate mt-0.5"
                   th:title="${sseSubscription.userAgent()}"
                   th:text="${sseSubscription.userAgent()}">UserAgent</p>
            </div>
        </div>
    </div>
</div>
