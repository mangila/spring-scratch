---
default_install_hook_types:
  - pre-commit
  - commit-msg

fail_fast: false
minimum_pre_commit_version: "4.6.0"
repos:
  - repo: local
    hooks:
      - id: mvn-clean-verify
        name: Maven Verify
        entry: mvn clean verify
        language: system
        require_serial: true
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Check commit message for conventional commits format
        stages: [commit-msg]
        args: [--strict, --force-scope, feat, chore, docs, test]