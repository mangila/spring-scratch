# App
app:
  integration:
    pokemon-api:
      url: "https://pokeapi.co"
      sprites-url: "https://raw.githubusercontent.com/PokeAPI/sprites"
    rust-fs:
      url: "http://localhost:9000"
      bucket: "pokemon"
      username: "rustfsadmin"
      password: "rustfsadmin123"
# Spring
spring:
  application:
    name: spring1
  flyway:
    enabled: true
    fail-on-missing-locations: true
    postgresql:
      transactional-lock: true
    connect-retries: 3
  modulith:
    runtime:
      flyway-enabled: true
    events:
      jdbc:
        schema-initialization:
          enabled: false
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      static-locations:
        - classpath:/static/
        - classpath:/static/browser/
    error:
      whitelabel:
        enabled: false
  docker:
    compose:
      enabled: true
      file: ./spring1/compose.yaml
      skip:
        in-tests: true
  threads:
    virtual:
      enabled: true
# Server
server:
  http2:
    enabled: true
  forward-headers-strategy: native
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
      - application/problem+json
      - image/svg+xml
# JobRunr
jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: 8000
  job-scheduler:
    enabled: true
management:
  endpoint:
    health:
      show-details: always
# SpringDoc
springdoc:
  show-actuator: true
  swagger-ui:
    enabled: true
    urls:
      - name: Server API
        url: /openapi/openapi.yaml
      - name: PokeAPI Client Integration
        url: /openapi/client/pokeapi.yaml
    urls-primary-name: Server API
  api-docs:
    enabled: true
# Decorator
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j